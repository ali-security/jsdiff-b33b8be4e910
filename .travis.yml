language: node_js
sudo: false
env:
  global:
    - secure: fyHOH0NftlAdy2tQawAq+qqcnc7GWo7ojRl5oHi30ueu79wFWTTWWvARCA8eo+FtWZsGlLfvyuzpmjnbJfMaN3wCzVfCG8ddd+nDhYKYbA4j+iqJarELQlVY5QguVGryO1emRPxFg2+WaSiaHCEvp5/eC7KYyHmlGtq0K0y1Svc=
    - secure: y/hyg7hEbYMoBjQOJ8UUrRp01PT4un0fTJWzNbRWUzAC6RXNOPd/SaOREHkJ/exLoyl5xV5I3gI4jOqy/KgtOH1DBEDuV6puq61Xc5C5GQ7OWiTNAnUZIbmNeTNgKdsfOySLvrEMNVN5xfL/SPe9yQKB2R4fUZ1MdBDAHs+xIas=

before_install:
  - command -v yarn >/dev/null 2>&1 || npm install -g yarn@1.22.22

# yarn.lock pins grunt 1.6.1, whose engines field says node >=16; it runs fine on
# Node 10, so skip the engines check rather than touch the lockfile.
install: yarn install --frozen-lockfile --ignore-engines

# grunt-cli is a devDependency; the image has no global grunt.
script: yarn grunt travis

matrix:
  include:
    - node_js: '21'
      dist: jammy
      env: KARMA=
    - node_js: '10'
      env: KARMA=
    # Node 0.3 (package.json engines floor) has no prebuilt binary and no usable
    # npm: deps + lib/ are built with Node 10, node 0.3.8 is compiled from source
    # with gcc 4.8, and the full mocha suite runs under it.
    # See test/legacy-node/run-legacy.sh.
    - node_js: '10'
      dist: xenial
      env: KARMA= SEAL_LEGACY_NODE=0.3.8
      addons:
        apt:
          packages:
            - gcc-4.8
            - g++-4.8
            - python2.7
      script:
        - yarn grunt clean build
        - ./test/legacy-node/run-legacy.sh

cache:
  directories:
    - node_modules
